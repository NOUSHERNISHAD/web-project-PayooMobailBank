<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <!-- daisyUI cdn -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome cdn -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body class="bg-[#f4f5f7] h-[100vh]">
    <div class="max-w-lg mx-auto bg-white rounded-b-xl">
        <nav class="flex justify-between items-center   border-b-1 border-gray-400 p-3">
        <div class="flex">
            <img class="h-[50px]" src="./assets/Group.png" alt="">
            <div class="ml-3">
                <h2 class="font-bold">$ <span>45000</span></h2>
                <p class="text-[#08080880]">Available Balance</p>
            </div>

        </div>
        <div>
            <button class="btn"><i class="fa-solid fa-arrow-right-from-bracket rotate-180"></i><span class="text-[#08080880]">Log Out</span></button>
        </div>

    </nav>
    <div class="mt-8 p-3 ">
        <h1 class="font-extrabold text-2xl ">🔥 Welcome to Payooo!</h1>
        <p class="text-[#08080880]">Enjoy easy and convenient financial services with us. <br> Cashout charge is low and </p>
    </div>

    <div class="min-h-[200px] grid grid-cols-3 gap-4 p-3 mt-6">

        <div class="border-2 border-gray-300 text-center p-3 rounded-xl">
            <img class="mx-auto" src="./assets/wallet1.png" alt="">
            <h2 class="text-[#080808]">Add Money</h2>
        </div>
        <div class="border-2 border-gray-300 text-center p-3 rounded-xl">
            <img class="mx-auto" src="./assets/send1.png" alt="">
            <h2 class="text-[#080808]">Cashout</h2>
        </div>
        <div class="border-2 border-gray-300 text-center p-3 rounded-xl">
            <img class="mx-auto" src="./assets/money1.png" alt="">
            <h2 class="text-[#080808]">Transfer Money</h2>
        </div>
        <div class="border-2 border-gray-300 text-center p-3 rounded-xl">
            <img class="mx-auto" src="./assets/bonus1.png" alt="">
            <h2 class="text-[#080808]">Get Bonus</h2>
        </div>
        <div class="border-2 border-gray-300 text-center p-3 rounded-xl">
            <img class="mx-auto" src="./assets/purse1.png" alt="">
            <h2 class="text-[#080808]">Pay Bill</h2>
        </div>
        <div class="border-2 border-gray-300 text-center p-3 rounded-xl">
            <img class="mx-auto" src="./assets/transaction1.png" alt="">
            <h2 class="text-[#080808]">Transactions</h2>
        </div>
    </div>

    </div>

</body>
</html>
