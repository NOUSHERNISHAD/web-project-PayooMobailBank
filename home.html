<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <!-- daisyUI cdn -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body class="bg-[#f4f5f7] h-[170vh]">

    <div class="max-w-lg mx-auto bg-white rounded-b-xl">

        <nav class="flex justify-between items-center   border-b-1 border-gray-400 p-3">
            <div class="flex">
                <img class="h-[50px]" src="./assets/Group.png" alt="">
                <div class="ml-3">
                    <h2 class="font-bold">$ <span id="available-balance">45000</span></h2>
                    <p class="text-[#08080880]">Available Balance</p>
                </div>

            </div>
            <div>
                <button class="btn"><i class="fa-solid fa-arrow-right-from-bracket rotate-180"></i><span
                        class="text-[#08080880]">Log Out</span></button>
            </div>

        </nav>

        <div class="mt-8 p-3 ">
            <h1 class="font-extrabold text-2xl ">🔥 Welcome to Payooo!</h1>
            <p class="text-[#08080880]">Enjoy easy and convenient financial services with us. <br> Cashout charge is low
                and </p>
        </div>

        <div class="min-h-[200px] grid grid-cols-3 gap-4 p-3 mt-6">

            <div id="add-button" class="form-btn border-2 border-gray-300 text-center p-3 rounded-xl">
                <img class="mx-auto" src="./assets/wallet1.png" alt="">
                <h2 class="text-[#080808]">Add Money</h2>
            </div>
            <div id="cash-out-button" class="form-btn border-2 border-gray-300 text-center p-3 rounded-xl">
                <img class="mx-auto" src="./assets/send1.png" alt="">
                <h2 class="text-[#080808]">Cashout</h2>
            </div>
            <div id="transfer-button" class="form-btn border-2 border-gray-300 text-center p-3 rounded-xl">
                <img class="mx-auto" src="./assets/money1.png" alt="">
                <h2 class="text-[#080808]">Transfer Money</h2>
            </div>
            <div id="get-bonus-button" class="form-btn border-2 border-gray-300 text-center p-3 rounded-xl">
                <img class="mx-auto" src="./assets/bonus1.png" alt="">
                <h2 class="text-[#080808]">Get Bonus</h2>
            </div>
            <div id="pay-bill-button" class="form-btn border-2 border-gray-300 text-center p-3 rounded-xl">
                <img class="mx-auto" src="./assets/purse1.png" alt="">
                <h2 class="text-[#080808]">Pay Bill</h2>
            </div>
            <div id="transactions-button" class="form-btn border-2 border-gray-300 text-center p-3 rounded-xl">
                <img class="mx-auto" src="./assets/transaction1.png" alt="">
                <h2 class="text-[#080808]">Transactions</h2>
            </div>
        </div>

    </div>

    <div class="max-w-lg mx-auto">

        <!-- add money feature -->
        <div class="form" id="add-money-parent">
            <h1 class="mb-4 mt-8 font-bold">Add Money</h1>
            <form action="" class="bg-white rounded-2xl p-8">
                <div class="">
                    <label class="font-semibold" for="">Select A Bank</label>
                    <br>
                    <select id="bank" class="select bg-[#f4f5f7] mt-3 mb-4 rounded-3xl w-full ">
                        <option disabled selected>Select bank</option>
                        <option>Islami Bank</option>
                        <option>Rupali Bank</option>
                        <option>MTB Bank</option>
                    </select>
                </div>

                <div>
                    <label class="font-semibold" for="">Bank Account Number</label>
                    <br>
                    <input id="account-number" type="text" placeholder="Enter 11 digit account number"
                        class="input  bg-[#f4f5f7] mt-3 mb-4 rounded-3xl w-full" />
                </div>

                <div>
                    <label class="font-semibold" for="">Amount to Add</label>
                    <br>
                    <input id="add-amount" type="text" placeholder="Add Amount to withdraw"
                        class="input  bg-[#f4f5f7] mt-3 mb-4 rounded-3xl w-full" />
                </div>

                <div>
                    <label class="font-semibold" for="">Pin Number</label>
                    <br>
                    <input id="add-pin" type="text" placeholder="Enter 4 digit pin number"
                        class="input  bg-[#f4f5f7] mt-3 rounded-3xl w-full" />
                </div>

                <button id="add-money-btn" class="btn btn-primary w-full mt-5 rounded-3xl">Add Money</button>


            </form>
        </div>

        <!-- cash out feature -->

        <div class="form" id="cash-out-parent" style="display: none;">
            <h1 class="mb-4 mt-8 font-bold">Cash Out</h1>


            <form action="" class="bg-white rounded-2xl p-8">


                <div>
                    <label class="font-semibold" for="">Agent Number</label>
                    <br>
                    <input id="agent-number" type="text" placeholder="Enter 11 digit number"
                        class="input  bg-[#f4f5f7] mt-3 mb-4 rounded-3xl w-full" />
                </div>

                <div>
                    <label class="font-semibold" for="">Amount</label>
                    <br>
                    <input id="withdraw-amount" type="text" placeholder="Enter amount to withdraw"
                        class="input  bg-[#f4f5f7] mt-3 mb-4 rounded-3xl w-full" />
                </div>

                <div>
                    <label class="font-semibold" for="">Pin Number</label>
                    <br>
                    <input id="pin-number" type="text" placeholder="Enter 4 digit pin number"
                        class="input  bg-[#f4f5f7] mt-3 rounded-3xl w-full" />
                </div>

                <button id="withdraw-btn" class="btn btn-primary w-full mt-5 rounded-3xl">Withdraw Money</button>


            </form>


        </div>


        <!-- transfer money  -->
        <div class="form" id="transfer-money-parent" style="display: none;">
            <h1 class="mb-4 mt-8 font-bold">Transfer Money</h1>
        </div>

        <!-- get bonus  -->
        <div class="form" id="get-bonus-parent" style="display: none;">
            <h1 class="mb-4 mt-8 font-bold">Get Bonus</h1>
        </div>

        <!-- pay bill  -->
        <div class="form" id="pay-bill-parent" style="display: none;">
            <h1 class="mb-4 mt-8 font-bold">Pay Bill</h1>
        </div>

        <!-- transactions  -->

        <div class="form" id="transactions-parent" style="display: none;">
            <div class="flex justify-between items-center">
                <h1 class="mb-4 mt-8 font-bold">Transaction History</h1>
                <p class="text-[#08080880]">View All</p>
            </div>

            <div id="transaction-container">
                
            </div>
        </div>



    </div>

    <script src="./home.js"></script>

</body>

</html>
